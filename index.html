<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TriPool - 3-Person Fair Carpool Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding-bottom: 80px; min-height: 100vh; }
    
    .header {
      position: sticky; top: 0; z-index: 30;
      background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      max-width: 600px; margin: 0 auto;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .badge-3p {
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
      background: rgba(16, 185, 129, 0.15); color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3); text-transform: uppercase;
    }
    .header-btns { display: flex; align-items: center; gap: 6px; }
    .btn-header-icon {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155;
      padding: 7px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    
    .container { max-width: 600px; margin: 0 auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
    
    .bar-controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .week-nav { display: flex; align-items: center; background: #131c2e; border: 1px solid #1e293b; border-radius: 8px; padding: 2px; }
    .week-nav-btn { background: none; border: none; color: #94a3b8; padding: 6px 10px; cursor: pointer; font-size: 14px; }
    .week-nav-label { font-size: 12px; font-weight: 600; padding: 0 8px; color: #f1f5f9; white-space: nowrap; }
    .btn-auto {
      background: #4f46e5; color: #ffffff; border: none; padding: 8px 12px;
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    
    .day-card {
      background: #131c2e; border-radius: 12px; border: 1px solid #1e293b;
      padding: 12px 14px; margin-bottom: 10px;
    }
    .day-card.skipped { opacity: 0.55; background: rgba(19, 28, 46, 0.4); }
    .day-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }
    .day-title-wrap { display: flex; align-items: baseline; gap: 6px; }
    .day-name { font-size: 14px; font-weight: 700; color: #ffffff; }
    .day-date { font-size: 12px; font-weight: 500; color: #94a3b8; }
    .day-off-tag { font-size: 10px; background: #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; }
    .btn-day-off {
      background: #1e293b; border: 1px solid #334155; color: #cbd5e1;
      font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
    }
    .btn-day-off.active { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color: #34d399; }
    
    .session-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .session-col {
      background: #0b1120; border-radius: 10px; padding: 10px;
      border: 1px solid rgba(51, 65, 85, 0.4); display: flex; flex-direction: column; gap: 8px;
    }
    .session-title { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .session-title.am { color: #f59e0b; }
    .session-title.pm { color: #818cf8; }
    
    .driver-btn {
      width: 100%; background: #19253c; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 10px; color: #fff; font-size: 12px; font-weight: 600; text-align: left;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .driver-btn:hover { border-color: #10b981; }
    .driver-btn-unassigned { color: #64748b; font-weight: 400; }
    
    .avail-label { font-size: 10px; color: #64748b; margin-top: 2px; }
    .avail-chips { display: flex; flex-direction: column; gap: 4px; }
    .chip {
      font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chip.available { background: #131c2e; color: #cbd5e1; border: 1px solid #1e293b; }
    .chip.unavailable { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); text-decoration: line-through; }
    
    .card-share {
      background: #131c2e; border: 1px solid #1e293b; border-radius: 14px;
      padding: 16px; margin-top: 10px;
    }
    .card-share-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .card-share-desc { font-size: 11px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; }
    .share-btns-row { display: flex; gap: 8px; }
    .btn-wa-action {
      flex: 2; background: #059669; color: #ffffff; border: none; padding: 10px 14px;
      border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-copy-action {
      flex: 1; background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #131c2e; border: 1px solid #334155; border-radius: 14px;
      width: 100%; max-width: 380px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-top h3 { font-size: 14px; font-weight: 700; color: #fff; }
    .btn-close-x { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
    
    .picker-option {
      background: #0b1120; border: 1px solid #1e293b; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 6px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600;
    }
    .picker-option.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.1); color: #34d399; }
    .picker-option.unavail-option { opacity: 0.6; }
    .picker-option.unassign-option { color: #94a3b8; font-weight: 400; }
    
    .member-input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .member-input-row input {
      flex: 1; background: #0b1120; border: 1px solid #334155; color: #fff;
      padding: 8px 10px; font-size: 13px; border-radius: 8px; outline: none;
    }
    .btn-primary {
      width: 100%; background: #059669; color: #fff; border: none; padding: 10px;
      border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 10px;
    }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: #042f2e; padding: 8px 16px; border-radius: 20px;
      font-size: 12px; font-weight: 700; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-wrap">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#042f2e" stroke-width="2.2">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <div class="brand-title">TriPool <span class="badge-3p">3 Riders</span></div>
    </div>
    <div class="header-btns">
      <button class="btn-header-icon" id="btnSettings" title="Edit Riders">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="bar-controls">
      <div class="week-nav">
        <button class="week-nav-btn" id="btnPrevWeek">&lt;</button>
        <span class="week-nav-label" id="weekLabel">This Week</span>
        <button class="week-nav-btn" id="btnNextWeek">&gt;</button>
      </div>
      <button class="btn-auto" id="btnAutoFill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
        </svg>
        Auto-Fill Week
      </button>
    </div>

    <section id="daysContainer"></section>

    <div class="card-share">
      <div class="card-share-title">Share with WhatsApp Group</div>
      <div class="card-share-desc">Send the current assignments and availability to your group chat. Anyone opening the link will see the saved schedule.</div>
      <div class="share-btns-row">
        <button class="btn-wa-action" id="btnWhatsApp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          Share to WhatsApp
        </button>
        <button class="btn-copy-action" id="btnCopyLink">Copy Link</button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="driverPickerModal">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="pickerTitle">Select Driver</h3>
        <button class="btn-close-x" id="btnClosePicker">&times;</button>
      </div>
      <div id="pickerOptionsContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-top">
        <h3>Edit Rider Names</h3>
        <button class="btn-close-x" id="btnCloseSettings">&times;</button>
      </div>
      <div id="settingsRiderInputs"></div>
      <button class="btn-primary" id="btnSaveRiders">Save Names</button>
    </div>
  </div>

  <div class="toast" id="toastMsg">Copied!</div>

  <script>
    (function() {
      const DAY_NAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
      let state = {
        members: [
          { id: 'm1', name: 'Rider 1' },
          { id: 'm2', name: 'Rider 2' },
          { id: 'm3', name: 'Rider 3' }
        ],
        weekOffset: 0,
        schedules: {}
      };

      let activePicker = null;

      function showToast(text) {
        const el = document.getElementById('toastMsg');
        el.textContent = text;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
      }

      // Compute the exact Monday date for the selected week offset
      function getMondayOfWeek(offset) {
        const now = new Date();
        const day = now.getDay(); // 0 is Sunday, 6 is Saturday
        
        // If it's Saturday (6) or Sunday (0), advance to upcoming Monday
        let diffToMonday = 1 - day;
        if (day === 0) diffToMonday = 1;      // Sunday -> next day
        if (day === 6) diffToMonday = 2;      // Saturday -> 2 days ahead

        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday + (offset * 7));
        return monday;
      }

      function getWeekDaysData(offset) {
        const monday = getMondayOfWeek(offset);
        const days = [];
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        for (let i = 0; i < 5; i++) {
          const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const isoDate = `${yyyy}-${mm}-${dd}`;
          const formattedDate = `${monthNames[d.getMonth()]} ${d.getDate()}`;

          days.push({
            name: DAY_NAMES[i],
            shortName: DAY_NAMES[i].slice(0, 3),
            isoDate: isoDate,
            formattedDate: formattedDate,
            key: isoDate // Schedule storage key is the exact YYYY-MM-DD
          });
        }
        return days;
      }

      function safeLoad() {
        let imported = null;
        try {
          const params = new URLSearchParams(window.location.search);
          const raw = params.get('s');
          if (raw) imported = JSON.parse(decodeURIComponent(escape(atob(raw))));
        } catch (e) {}

        if (!imported) {
          try {
            const local = localStorage.getItem('tripool_schedule_data');
            if (local) imported = JSON.parse(local);
          } catch (e) {}
        }

        if (imported) {
          if (Array.isArray(imported.m) && imported.m.length === 3) state.members = imported.m;
          if (imported.s) state.schedules = imported.s;
        }
      }

      function safeSave() {
        try {
          localStorage.setItem('tripool_schedule_data', JSON.stringify({ m: state.members, s: state.schedules }));
        } catch (e) {}
        render();
      }

      function render() {
        const weekDays = getWeekDaysData(state.weekOffset);
        const container = document.getElementById('daysContainer');
        container.innerHTML = '';

        // Update Week Navigation Label with real dates (e.g. "Oct 5 – Oct 9, 2026")
        const startDay = weekDays[0];
        const endDay = weekDays[4];
        const yearStr = (startDay.formattedDate.split(' ')[0] === endDay.formattedDate.split(' ')[0]) 
          ? `${startDay.formattedDate} – ${endDay.formattedDate}`
          : `${startDay.formattedDate} – ${endDay.formattedDate}`;
        document.getElementById('weekLabel').textContent = yearStr;

        weekDays.forEach(dayObj => {
          const key = dayObj.key;
          const s = state.schedules[key] || { skip: false, am: '', pm: '', unavail_am: [], unavail_pm: [] };
          const unavailAm = s.unavail_am || [];
          const unavailPm = s.unavail_pm || [];

          const amMember = state.members.find(m => m.id === s.am);
          const pmMember = state.members.find(m => m.id === s.pm);

          const card = document.createElement('div');
          card.className = `day-card ${s.skip ? 'skipped' : ''}`;

          let html = `
            <div class="day-header">
              <div class="day-title-wrap">
                <span class="day-name">${dayObj.name}</span>
                <span class="day-date">· ${dayObj.formattedDate}</span>
                ${s.skip ? '<span class="day-off-tag">Day Off</span>' : ''}
              </div>
              <button class="btn-day-off ${s.skip ? 'active' : ''}" data-day="${key}">
                ${s.skip ? 'Cancel Day Off' : 'Mark Day Off'}
              </button>
            </div>
          `;

          if (s.skip) {
            html += `<div style="text-align: center; font-size: 11px; color: #64748b; padding: 10px 0;">Commute skipped (Day Off)</div>`;
          } else {
            html += `
              <div class="session-grid">
                <!-- AM Session -->
                <div class="session-col">
                  <div class="session-title am">☀️ Morning (AM)</div>
                  <button class="driver-btn ${!amMember ? 'driver-btn-unassigned' : ''}" data-day="${key}" data-slot="am" data-dayname="${dayObj.shortName}">
                    <span>${amMember ? amMember.name : 'Select Driver'}</span>
                    <span style="font-size: 10px;">▼</span>
                  </button>
                  <span class="avail-label">Availability:</span>
                  <div class="avail-chips">
                    ${state.members.map(m => {
                      const isUn = unavailAm.includes(m.id);
                      return `
                        <div class="chip ${isUn ? 'unavailable' : 'available'}" data-day="${key}" data-slot="am" data-mid="${m.id}">
                          <span>${m.name}</span>
                          <span style="font-size: 9px;">${isUn ? 'Off' : 'OK'}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>

                <!-- PM Session -->
                <div class="session-col">
                  <div class="session-title pm">🌙 Evening (PM)</div>
                  <button class="driver-btn ${!pmMember ? 'driver-btn-unassigned' : ''}" data-day="${key}" data-slot="pm" data-dayname="${dayObj.shortName}">
                    <span>${pmMember ? pmMember.name : 'Select Driver'}</span>
                    <span style="font-size: 10px;">▼</span>
                  </button>
                  <span class="avail-label">Availability:</span>
                  <div class="avail-chips">
                    ${state.members.map(m => {
                      const isUn = unavailPm.includes(m.id);
                      return `
                        <div class="chip ${isUn ? 'unavailable' : 'available'}" data-day="${key}" data-slot="pm" data-mid="${m.id}">
                          <span>${m.name}</span>
                          <span style="font-size: 9px;">${isUn ? 'Off' : 'OK'}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            `;
          }

          card.innerHTML = html;
          container.appendChild(card);
        });

        attachCardEvents();
      }

      function attachCardEvents() {
        document.querySelectorAll('.btn-day-off').forEach(btn => {
          btn.onclick = function() {
            const key = this.getAttribute('data-day');
            if (!state.schedules[key]) state.schedules[key] = { skip: false, am: '', pm: '', unavail_am: [], unavail_pm: [] };
            state.schedules[key].skip = !state.schedules[key].skip;
            safeSave();
          };
        });

        document.querySelectorAll('.driver-btn').forEach(btn => {
          btn.onclick = function() {
            const key = this.getAttribute('data-day');
            const slot = this.getAttribute('data-slot');
            const dayname = this.getAttribute('data-dayname');
            openDriverPicker(key, slot, dayname);
          };
        });

        document.querySelectorAll('.chip').forEach(chip => {
          chip.onclick = function() {
            const key = this.getAttribute('data-day');
            const slot = this.getAttribute('data-slot');
            const mid = this.getAttribute('data-mid');
            const listKey = slot === 'am' ? 'unavail_am' : 'unavail_pm';

            if (!state.schedules[key]) state.schedules[key] = { skip: false, am: '', pm: '', unavail_am: [], unavail_pm: [] };
            if (!Array.isArray(state.schedules[key][listKey])) state.schedules[key][listKey] = [];

            const list = state.schedules[key][listKey];
            const idx = list.indexOf(mid);
            if (idx > -1) {
              list.splice(idx, 1);
            } else {
              list.push(mid);
              if (state.schedules[key][slot] === mid) state.schedules[key][slot] = '';
            }
            safeSave();
          };
        });
      }

      function openDriverPicker(key, slot, dayname) {
        activePicker = { key, slot };
        const s = state.schedules[key] || { skip: false, am: '', pm: '', unavail_am: [], unavail_pm: [] };
        const currentSelected = s[slot] || '';
        const unavailList = (slot === 'am' ? s.unavail_am : s.unavail_pm) || [];

        const titleEl = document.getElementById('pickerTitle');
        titleEl.textContent = `${dayname || ''} · ${slot.toUpperCase()} Driver`;

        const container = document.getElementById('pickerOptionsContainer');
        container.innerHTML = '';

        state.members.forEach(m => {
          const isSelected = currentSelected === m.id;
          const isUnavail = unavailList.includes(m.id);

          const div = document.createElement('div');
          div.className = `picker-option ${isSelected ? 'selected' : ''} ${isUnavail ? 'unavail-option' : ''}`;
          div.innerHTML = `
            <div>
              ${m.name} ${isUnavail ? '<span style="color:#ef4444; font-size:10px; margin-left:4px;">(Unavailable)</span>' : ''}
            </div>
            ${isSelected ? '<span>✓</span>' : ''}
          `;
          div.onclick = function() {
            selectDriver(m.id);
          };
          container.appendChild(div);
        });

        // Clear option
        const clearDiv = document.createElement('div');
        clearDiv.className = 'picker-option unassign-option';
        clearDiv.innerHTML = `<span>Unassigned</span> ${!currentSelected ? '<span>✓</span>' : ''}`;
        clearDiv.onclick = function() {
          selectDriver('');
        };
        container.appendChild(clearDiv);

        document.getElementById('driverPickerModal').classList.add('open');
      }

      function selectDriver(memberId) {
        if (!activePicker) return;
        const { key, slot } = activePicker;
        if (!state.schedules[key]) state.schedules[key] = { skip: false, am: '', pm: '', unavail_am: [], unavail_pm: [] };
        state.schedules[key][slot] = memberId;
        document.getElementById('driverPickerModal').classList.remove('open');
        safeSave();
      }

      function autoFill() {
        const weekDays = getWeekDaysData(state.weekOffset);
        let turn = 0;

        weekDays.forEach(dayObj => {
          const key = dayObj.key;
          if (!state.schedules[key]) state.schedules[key] = { skip: false, am: '', pm: '', unavail_am: [], unavail_pm: [] };
          const s = state.schedules[key];
          if (s.skip) return;

          ['am', 'pm'].forEach(slot => {
            if (!s[slot]) {
              const blocked = (slot === 'am' ? s.unavail_am : s.unavail_pm) || [];
              const available = state.members.filter(m => !blocked.includes(m.id));
              if (available.length > 0) {
                const pick = available[turn % available.length];
                s[slot] = pick.id;
                turn++;
              }
            }
          });
        });

        safeSave();
        showToast('Week auto-filled!');
      }

      function getShareableUrl() {
        const payload = JSON.stringify({ m: state.members, s: state.schedules });
        const encoded = btoa(unescape(encodeURIComponent(payload)));
        const baseUrl = window.location.href.split('?')[0];
        return `${baseUrl}?s=${encoded}`;
      }

      function shareWhatsApp() {
        const weekDays = getWeekDaysData(state.weekOffset);
        const link = getShareableUrl();
        const startDay = weekDays[0];
        const endDay = weekDays[4];
        let msg = `🚗 *TriPool Carpool Schedule (${startDay.formattedDate} – ${endDay.formattedDate})*\n\n`;

        weekDays.forEach(dayObj => {
          const k = dayObj.key;
          const s = state.schedules[k];
          if (s && s.skip) {
            msg += `📅 *${dayObj.shortName}, ${dayObj.formattedDate}*: Day Off\n`;
          } else if (s) {
            const am = state.members.find(m => m.id === s.am)?.name || 'Needs Driver';
            const pm = state.members.find(m => m.id === s.pm)?.name || 'Needs Driver';
            msg += `📅 *${dayObj.shortName}, ${dayObj.formattedDate}*: AM: ${am} | PM: ${pm}\n`;
          } else {
            msg += `📅 *${dayObj.shortName}, ${dayObj.formattedDate}*: Open\n`;
          }
        });

        msg += `\nOpen and update schedule here:\n${link}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
      }

      function copyShareLink() {
        const link = getShareableUrl();
        if (navigator.clipboard) {
          navigator.clipboard.writeText(link).then(() => showToast('Share link copied!'));
        } else {
          prompt('Copy this link:', link);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        safeLoad();
        render();

        document.getElementById('btnPrevWeek').onclick = () => {
          state.weekOffset--;
          render();
        };

        document.getElementById('btnNextWeek').onclick = () => {
          state.weekOffset++;
          render();
        };

        document.getElementById('btnAutoFill').onclick = autoFill;
        document.getElementById('btnWhatsApp').onclick = shareWhatsApp;
        document.getElementById('btnCopyLink').onclick = copyShareLink;

        document.getElementById('btnClosePicker').onclick = () => {
          document.getElementById('driverPickerModal').classList.remove('open');
        };

        document.getElementById('btnSettings').onclick = () => {
          const container = document.getElementById('settingsRiderInputs');
          container.innerHTML = '';
          state.members.forEach((m, idx) => {
            const row = document.createElement('div');
            row.className = 'member-input-row';
            row.innerHTML = `<input type="text" id="inp_m_${idx}" value="${m.name}" placeholder="Rider Name" />`;
            container.appendChild(row);
          });
          document.getElementById('settingsModal').classList.add('open');
        };

        document.getElementById('btnCloseSettings').onclick = () => {
          document.getElementById('settingsModal').classList.remove('open');
        };

        document.getElementById('btnSaveRiders').onclick = () => {
          state.members.forEach((m, idx) => {
            const el = document.getElementById(`inp_m_${idx}`);
            if (el && el.value.trim()) m.name = el.value.trim();
          });
          document.getElementById('settingsModal').classList.remove('open');
          safeSave();
          showToast('Names updated!');
        };
      });
    })();
  </script>
</body>
</html>
